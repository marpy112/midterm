services:

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo-data:/data/db
    # No published port: the database is reachable only from the app container.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DB:-crud_demo}?authSource=admin
    ports:
      # APP_PORT lets the container run beside the VM's systemd service, which
      # holds 3000. Set APP_PORT=8080 in .env to demonstrate both at once.
      - "${APP_PORT:-3000}:3000"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
