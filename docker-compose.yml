services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-appuser}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-crud_demo}
    volumes:
      - mongo-data:/data/db
    # No "ports:" on purpose - the database is only reachable from the app
    # over the private compose network, never from the host or the internet.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3000
      # Credentials come from the environment, never from the image or source.
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-appuser}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DB:-crud_demo}?authSource=admin
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
